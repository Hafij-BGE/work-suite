[package]
name = "wordcraft-android"
description = "WordCraft for Android phones and tablets (eframe on NativeActivity, wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Not `[lints] workspace = true`: Android starts the app through a C symbol (`android_main`), which
# needs `#[unsafe(no_mangle)]`, and the folders the app may use are handed over through the
# environment. Both are allowed on their own lines below; the rest of the crate stays safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[lib]
# `cdylib` is the libwordcraft_android.so the APK loads; `rlib` keeps host builds and tests working.
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-proof = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
# `AndroidApp` (folders, soft keyboard); the same winit eframe runs on.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# Records go to logcat (`adb logcat -s WordCraft`).
android_logger = "0.15"
