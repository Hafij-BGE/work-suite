[package]
name = "wordcraft-android"
description = "WorkSuite for Android: Writer (WordCraft), Slides (DeckCraft) and Sheets (GridCraft) in one app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Not `[lints] workspace = true`: Android starts the app through a C symbol (`android_main`), which
# needs `#[unsafe(no_mangle)]`, and the folders the app may use are handed over through the
# environment. Both are allowed on their own lines below; the rest of the crate stays safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[lib]
# `cdylib` is the libwordcraft_android.so the APK loads; `rlib` keeps host builds and tests working.
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-proof = { workspace = true }
# The suite's other two apps, from their own workspaces (deckcraft/, gridcraft/).
deckcraft-ui-egui = { path = "../../deckcraft/crates/ui-egui" }
deckcraft-engine = { path = "../../deckcraft/crates/engine" }
deckcraft-color = { path = "../../deckcraft/crates/color" }
gridcraft-ui-egui = { path = "../../gridcraft/crates/ui-egui" }
gridcraft-engine = { path = "../../gridcraft/crates/engine" }
# The font bar (src/fontbar.rs): the apps' font databases, and downloads of the fonts a document
# needs from Google Fonts and Microsoft (HTTPS with the bundled Mozilla roots; Microsoft's fonts
# come in a zip or a cabinet).
wordcraft-fonts = { workspace = true }
wordcraft-doc = { workspace = true }
deckcraft-fonts = { path = "../../deckcraft/crates/fonts" }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zip = { workspace = true }
cab = "0.6"
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
# `AndroidApp` (folders, soft keyboard); the same winit eframe runs on.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# Records go to logcat (`adb logcat -s WorkSuiteWriter`).
android_logger = "0.15"
# Calls into WorkSuiteActivity (Java) for the system file picker and "Open with".
jni = "0.21"
