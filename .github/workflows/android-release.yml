# Android release: on a tag `android-v<version>`, or run by hand (Actions › Android release › Run
# workflow, which tags the commit `android-v<packaging/android/VERSION>`), build the release APK
# (packaging/android/build.sh release) and publish it as a GitHub Release with
# packaging/android/release-notes.md. Signed with the WORDCRAFT_KEYSTORE_* secrets (see
# packaging/android/README.md); the run fails without them, and unless the APK carries the release
# certificate below, so an APK Android would refuse as an update is never published. Run by hand
# with "replace" ticked, it first deletes a release (and tag) of the same version.
name: Android release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      replace:
        description: Delete an existing release and tag of the same version, after the new APK is built
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Install the SDK platform and NDK
        # The NDK this was tested with (r27c), and the platform Gradle builds against.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WORDCRAFT_KEYSTORE_BASE64 }}
          # Only whether each is there (never a value), to say what is missing.
          HAS_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD != '' }}
          VARIABLES: ${{ vars.WORDCRAFT_KEYSTORE_BASE64 != '' || vars.WORDCRAFT_KEYSTORE_PASSWORD != '' || vars.WORDCRAFT_KEY_ALIAS != '' || vars.WORDCRAFT_KEY_PASSWORD != '' }}
        run: |
          echo "secrets: WORDCRAFT_KEYSTORE_BASE64 $([ -n "$KEYSTORE_BASE64" ] && echo set || echo missing)," \
            "WORDCRAFT_KEYSTORE_PASSWORD $([ "$HAS_PASSWORD" = true ] && echo set || echo missing)," \
            "WORDCRAFT_KEY_ALIAS $([ "$HAS_ALIAS" = true ] && echo set || echo missing)," \
            "WORDCRAFT_KEY_PASSWORD $([ "$HAS_KEY_PASSWORD" = true ] && echo set || echo missing)"
          if [ "$VARIABLES" = true ]; then
            echo "::error::WORDCRAFT_* values are saved as Actions *variables*, which aren't secret: delete them there and add them on the Secrets tab."
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "WORDCRAFT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::No WORDCRAFT_KEYSTORE_BASE64 secret: a release signed with a throwaway key couldn't update an installed WorkSuite."
            exit 1
          fi
      - name: Build the APK
        env:
          WORDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          WORDCRAFT_KEY_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
          WORDCRAFT_KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
        run: packaging/android/build.sh release
      - name: Check the signing certificate
        env:
          # SHA-256 of WorkSuite's release certificate (CN=WorkSuite, O=Md Hafijur Rahman).
          RELEASE_CERT: 165ae9cd100ad137cfd6423b7802a7f84e34b397f315169d64803f9977610b9a
        run: |
          # The build-tools installed above, not whichever the runner image has newest.
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          out="$("$apksigner" verify --print-certs dist/release/*.apk 2>&1)" || true
          got="$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "certificate: $got"
          if [ "$got" != "$RELEASE_CERT" ]; then
            printf '%s\n' "$out"
            echo "::error::The APK is not signed with WorkSuite's release certificate."
            exit 1
          fi
      - name: Checksum and tag
        run: |
          cd dist/release && sha256sum -- *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/packaging/android/VERSION")"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="android-v$VERSION"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Delete the release being replaced
        if: ${{ inputs.replace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "no release $TAG to replace"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: WorkSuite ${{ env.TAG }}
          body_path: packaging/android/release-notes.md
          prerelease: true
          files: |
            dist/release/*.apk
            dist/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
